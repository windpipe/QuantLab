[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-engine"
version = "0.1.0"
description = "Local-first, evidence-backed market data and CPU reference backtesting"
requires-python = ">=3.11"
dependencies = ["duckdb==2.0.1", "pyarrow==26.0.1", "fastapi==0.165.0", "uvicorn==0.54.0", "httpx==0.28.1", "filelock==4.3.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
yahoo = ["yfinance==1.8.0"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
